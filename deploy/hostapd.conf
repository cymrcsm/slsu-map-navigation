# /etc/hostapd/hostapd.conf  —  the kiosk's own Wi-Fi network
#
# Raspberry Pi 4 built-in Wi-Fi. Visitors join this to reach the kiosk; it
# carries no internet. Change `ssid`, `country_code` and `wpa_passphrase` to
# suit. An open network (no passphrase) is fine too — delete the wpa_* lines and
# set `auth_algs=1` only — but WPA2 with a printed password keeps randoms off it.

interface=wlan0
driver=nl80211

ssid=SLSU-Kiosk-Map
country_code=PH
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1

auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=slsu-campus

# Let phones talk only to the kiosk, not each other.
ap_isolate=1
