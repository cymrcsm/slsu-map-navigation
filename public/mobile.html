<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SLSU Campus — Walking Directions</title>
  <!-- served by the kiosk at /go/<slug>; both lines are stripped for the public
       static build (tools/build-web.mjs), which is a flat site. -->
  <meta name="kiosk-hosted" content="1" />
  <base href="/" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <style>
    :root {
      --ink:#22312F; --paper:#FEFDF9; --teal:#0F7A87; --teal-deep:#0A5B66;
      --rufous:#C4622C; --danger:#9E2B22; --me:#1a73e8;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { height:100%; font-family:-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:#aab7ad; }
    #map { position:absolute; inset:0; background:#aab7ad; }
    .leaflet-container { background:#aab7ad; }

    .sheet {
      position:absolute; left:0; right:0; bottom:0; z-index:1000;
      background:var(--paper); border-radius:18px 18px 0 0;
      box-shadow:0 -6px 24px rgba(0,0,0,.20);
      padding:14px 16px calc(16px + env(safe-area-inset-bottom));
      max-height:42vh; overflow-y:auto;
    }
    .sheet h1 { font-size:1.15rem; line-height:1.25; }
    .sheet .sub { color:#63726A; font-size:.9rem; margin-top:2px; }
    .sheet .meta { margin-top:10px; font-size:.9rem; }
    .sheet .meta div { padding:3px 0; }
    .sheet .meta strong { color:#4b5a54; font-weight:600; }
    .status {
      margin-top:11px; font-size:.92rem; font-weight:600; padding:9px 11px;
      border-radius:9px; background:var(--teal); color:#fff;
    }
    .status.warn { background:#FBECE8; color:#8a3a2b; }
    .status.big  { font-size:1.05rem; }

    .fab {
      position:absolute; right:12px; z-index:1000;
      bottom:calc(42vh + 14px);
      display:flex; flex-direction:column; gap:10px;
    }
    .fab button {
      width:46px; height:46px; border-radius:50%; border:none;
      background:var(--paper); box-shadow:0 2px 10px rgba(0,0,0,.28);
      font-size:1.25rem; color:var(--teal-deep); display:grid; place-items:center;
    }
    .fab button.on { background:var(--teal); color:#fff; }

    /* Floor picker. One stacked group like the kiosk's, sitting above the
       follow button so both thumb targets stay in the same corner. */
    .floors {
      position:absolute; right:12px; z-index:1000;
      bottom:calc(42vh + 74px);
      display:flex; flex-direction:column;
      border-radius:12px; overflow:hidden;
      background:var(--paper); box-shadow:0 2px 10px rgba(0,0,0,.28);
    }
    .floors button {
      width:46px; height:40px; border:none; background:transparent;
      color:var(--teal-deep); font-size:.9rem; font-weight:700;
      display:grid; place-items:center;
    }
    .floors button + button { border-top:1px solid rgba(34,49,47,.12); }
    .floors button.on { background:var(--teal); color:#fff; }
    .floors button:disabled { opacity:.35; }
    /* display:flex above would otherwise beat the hidden attribute the kiosk
       copy sets on this group. */
    .floors[hidden] { display:none; }
    .fab button[hidden] { display:none; }

    /* Both markers are inline SVG that inherits colour from these rules, so the
       phone shows the destination warm and the walker blue, as the map does. */
    .dest-pin, .me-pin, .kiosk-pin { display:block; }
    .dest-pin svg, .me-pin svg, .kiosk-pin svg { width:100%; height:100%; display:block; }
    .dest-pin {
      width:30px; height:30px; color:var(--rufous);
      filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));
    }
    .me-pin {
      width:22px; height:22px; color:var(--me);
      filter:drop-shadow(0 1px 2px rgba(0,0,0,.45));
    }
    /* Where the walk started. Same tack as the walker, in the structural teal
       and a size down, so the two read as related without competing - the
       blue one is you, this one is the kiosk you left. */
    .kiosk-pin {
      width:20px; height:20px; color:var(--teal-deep); opacity:.85;
      filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="floors" id="floor-picker" role="group" aria-label="Floor">
    <button type="button" class="floor-btn" data-floor="0">GF</button>
    <button type="button" class="floor-btn" data-floor="1">2F</button>
    <button type="button" class="floor-btn" data-floor="2">3F</button>
  </div>

  <div class="fab">
    <button id="recenter-btn" aria-label="Follow my location" title="Follow my location">◎</button>
  </div>

  <section class="sheet">
    <h1 id="dest-name">Loading…</h1>
    <p class="sub" id="dest-sub"></p>
    <div class="meta" id="dest-meta"></div>
    <div class="status" id="status">Preparing your route…</div>
  </section>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/georef.js"></script>
  <script src="js/geo-overlay.js"></script>
  <script src="js/campus-data.js"></script>
  <script src="js/walkpaths.js"></script>
  <script src="js/routing.js"></script>
  <script src="js/mobile.js"></script>
</body>
</html>
