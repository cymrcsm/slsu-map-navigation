# DHCP + DNS for the kiosk's Wi-Fi
#
# Read straight from the repo by the slsu-kiosk-dns service that
# deploy/kiosk-ap.sh sets up - there is no copy in /etc. The kiosk holds
# 10.42.0.1 on wlan0 while its own Wi-Fi runs.
# This hands out addresses to phones and, crucially, answers the trusted
# hostname AND the OS connectivity-check domains locally, so no query ever
# needs to leave the box.

interface=wlan0
# Not the Pi's own lookups: only phones on the kiosk Wi-Fi ask this server. With
# an Ethernet cable in, the Pi itself keeps using the router's DNS.
except-interface=lo
# bind-dynamic, not bind-interfaces: wlan0 may come up after dnsmasq starts
# (NetworkManager on Bookworm), and dnsmasq picks it up when it does.
bind-dynamic
dhcp-range=10.42.0.50,10.42.0.200,255.255.255.0,24h
dhcp-option=option:router,10.42.0.1
dhcp-option=option:dns-server,10.42.0.1

# Do not forward anything upstream — this network is offline by design.
no-resolv
no-hosts

# The name the Let's Encrypt cert is issued for. Point it at the kiosk itself.
# CHANGE THIS to match the DuckDNS name you register.
address=/slsu-kiosk.duckdns.org/10.42.0.1

# Make the phone's "is there internet?" check succeed, so it does not nag the
# visitor to leave the network. The kiosk answers these paths (see server.js).
address=/connectivitycheck.gstatic.com/10.42.0.1
address=/connectivitycheck.android.com/10.42.0.1
address=/clients3.google.com/10.42.0.1
address=/www.google.com/10.42.0.1
address=/captive.apple.com/10.42.0.1
address=/www.apple.com/10.42.0.1
address=/www.msftconnecttest.com/10.42.0.1
address=/www.msftncsi.com/10.42.0.1

# Anything else fails to resolve rather than hanging.
address=/#/
